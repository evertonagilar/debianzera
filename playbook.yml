- hosts: all
  become: true
  vars:
    docker_users:
      - vagrant
    docker_cert_dir: /etc/docker/certs
    docker_daemon_config: /etc/docker/daemon.json

  roles:
    - geerlingguy.docker

  tasks:

    - name: Variáveis para provisionar o Docker
      debug:
        msg: 
        - "Provisionando o Docker no host {{ inventory_hostname }}"
        - "Usuários do Docker: {{ docker_users }}"
        - "Diretório de certificados: {{ docker_cert_dir }}"
        - "Configuração do daemon: {{ docker_daemon_config }}"
        - "ansible_all_ipv4_addresses: {{ ansible_all_ipv4_addresses }}"


# ################## Criar os certificados ##################

    - name: Ensure cert directory exists
      file:
        path: "{{ docker_cert_dir }}"
        state: directory
        mode: '0755'

    - name: Create server CSR config with all IPs
      copy:
        dest: "{{ docker_cert_dir }}/server-csr.conf"
        content: |
          [ req ]
          default_bits       = 2048
          prompt             = no
          default_md         = sha256
          distinguished_name = dn
          req_extensions     = v3_req

          [ dn ]
          CN = {{ ansible_hostname }}

          [ v3_req ]
          subjectAltName = @alt_names
          keyUsage = critical, digitalSignature, keyEncipherment
          extendedKeyUsage = serverAuth

          [ alt_names ]
          {% set ips = (ansible_all_ipv4_addresses + ['127.0.0.1']) | unique | sort %}
          {% for ip in ips %}
          IP.{{ loop.index }} = {{ ip }}
          {% endfor %}

    - name: Create client CSR config
      copy:
        dest: "{{ docker_cert_dir }}/client-csr.conf"
        content: |
          [ req ]
          default_bits       = 2048
          prompt             = no
          default_md         = sha256
          distinguished_name = dn
          req_extensions     = v3_req

          [ dn ]
          CN = docker-client

          [ v3_req ]
          keyUsage = critical, digitalSignature, keyEncipherment
          extendedKeyUsage = clientAuth

    - name: Generate CA private key
      command: openssl genrsa -out {{ docker_cert_dir }}/ca-key.pem 4096
      args:
        creates: "{{ docker_cert_dir }}/ca-key.pem"

    - name: Generate CA certificate
      command: >
        openssl req -x509 -new -nodes
        -key {{ docker_cert_dir }}/ca-key.pem
        -sha256 -days 365
        -out {{ docker_cert_dir }}/ca.pem
        -subj "/CN=docker-ca"
      args:
        creates: "{{ docker_cert_dir }}/ca.pem"

    - name: Generate server private key
      command: openssl genrsa -out {{ docker_cert_dir }}/server-key.pem 4096
      args:
        creates: "{{ docker_cert_dir }}/server-key.pem"

    - name: Generate server CSR
      command: >
        openssl req -new
        -key {{ docker_cert_dir }}/server-key.pem
        -out {{ docker_cert_dir }}/server.csr
        -config {{ docker_cert_dir }}/server-csr.conf
      args:
        creates: "{{ docker_cert_dir }}/server.csr"

    - name: Generate server certificate
      command: >
        openssl x509 -req
        -in {{ docker_cert_dir }}/server.csr
        -CA {{ docker_cert_dir }}/ca.pem
        -CAkey {{ docker_cert_dir }}/ca-key.pem
        -CAcreateserial
        -out {{ docker_cert_dir }}/server-cert.pem
        -days 365 -sha256
        -extensions v3_req
        -extfile {{ docker_cert_dir }}/server-csr.conf
      args:
        creates: "{{ docker_cert_dir }}/server-cert.pem"

    - name: Generate client private key
      command: openssl genrsa -out {{ docker_cert_dir }}/key.pem 4096
      args:
        creates: "{{ docker_cert_dir }}/key.pem"

    - name: Generate client CSR
      command: >
        openssl req -new
        -key {{ docker_cert_dir }}/key.pem
        -out {{ docker_cert_dir }}/client.csr
        -config {{ docker_cert_dir }}/client-csr.conf
      args:
        creates: "{{ docker_cert_dir }}/client.csr"

    - name: Generate client certificate
      command: >
        openssl x509 -req
        -in {{ docker_cert_dir }}/client.csr
        -CA {{ docker_cert_dir }}/ca.pem
        -CAkey {{ docker_cert_dir }}/ca-key.pem
        -CAcreateserial
        -out {{ docker_cert_dir }}/cert.pem
        -days 365 -sha256
        -extensions v3_req
        -extfile {{ docker_cert_dir }}/client-csr.conf
      args:
        creates: "{{ docker_cert_dir }}/cert.pem"

# ################## Copiar o certificado para o host local ##################

    - name: Criar diretório local para armazenar os certificados
      delegate_to: localhost
      run_once: true
      file:
        path: "./certs/{{ inventory_hostname }}"
        state: directory
        mode: '0777'

    - name: Copiar cert.pem do host remoto
      fetch:
        src: /etc/docker/certs/cert.pem
        dest: "./certs/{{ inventory_hostname }}/cert.pem"
        flat: yes

    - name: Copiar key.pem do host remoto
      fetch:
        src: /etc/docker/certs/key.pem
        dest: "./certs/{{ inventory_hostname }}/key.pem"
        flat: yes

    - name: Copiar ca.pem do host remoto
      fetch:
        src: /etc/docker/certs/ca.pem
        dest: "./certs/{{ inventory_hostname }}/ca.pem"
        flat: yes

    - name: Ajustar dono dos certificados para o usuário local
      delegate_to: localhost
      run_once: true
      become: true
      vars:
        local_user: "{{ lookup('env','USER') }}"
      command: chown -R "{{ local_user }}:" ./certs/


# ################## Configurar o service do docker para subir o daemon com tls ##################

    - name: Substituir docker.service com versão HTTPS customizada
      copy:
        dest: /lib/systemd/system/docker.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Docker Application Container Engine
          Documentation=https://docs.docker.com
          After=network-online.target nss-lookup.target firewalld.service containerd.service time-set.target
          Wants=network-online.target containerd.service
          Requires=containerd.service
          StartLimitBurst=3
          StartLimitIntervalSec=60

          [Service]
          Type=notify
          ExecStart=/usr/bin/dockerd \
            -H tcp://0.0.0.0:2376 \
            --tlsverify \
            --tlscacert={{ docker_cert_dir }}/ca.pem \
            --tlscert={{ docker_cert_dir }}/server-cert.pem \
            --tlskey={{ docker_cert_dir }}/server-key.pem \
            --containerd=/run/containerd/containerd.sock
          ExecReload=/bin/kill -s HUP $MAINPID
          TimeoutStartSec=0
          RestartSec=2
          Restart=always
          LimitNPROC=infinity
          LimitCORE=infinity
          TasksMax=infinity
          Delegate=yes
          KillMode=process
          OOMScoreAdjust=-500

          [Install]
          WantedBy=multi-user.target

    - name: Recarregar systemd
      command: systemctl daemon-reload

    - name: Reiniciar Docker
      service:
        name: docker
        state: restarted
        enabled: yes

# ################## Configurar o cliente no servidor ##################

    - name: Lista de usuários que devem ter o cliente Docker configurado
      set_fact:
        docker_client_users: ["vagrant", "ubuntu", "sigctl"]

    - name: Obter lista de usuários válidos
      command: "getent passwd {{ item }}"
      register: passwd_result
      loop: "{{ docker_client_users }}"
      failed_when: false
      changed_when: false

    - name: Filtrar usuários existentes
      set_fact:
        existing_docker_users: "{{ passwd_result.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

    - name: Criar ~/.docker e copiar certificados para cada usuário existente
      block:
        - name: Criar diretório ~/.docker
          file:
            path: "/home/{{ item }}/.docker"
            state: directory
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0700'
          loop: "{{ existing_docker_users }}"
          loop_control:
            label: "{{ item }}"

        - name: Copiar cert.pem
          copy:
            src: "{{ docker_cert_dir }}/cert.pem"
            dest: "/home/{{ item }}/.docker/cert.pem"
            remote_src: yes
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ existing_docker_users }}"
          loop_control:
            label: "{{ item }}"

        - name: Copiar key.pem
          copy:
            src: "{{ docker_cert_dir }}/key.pem"
            dest: "/home/{{ item }}/.docker/key.pem"
            remote_src: yes
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ existing_docker_users }}"
          loop_control:
            label: "{{ item }}"

        - name: Copiar ca.pem
          copy:
            src: "{{ docker_cert_dir }}/ca.pem"
            dest: "/home/{{ item }}/.docker/ca.pem"
            remote_src: yes
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ existing_docker_users }}"
          loop_control:
            label: "{{ item }}"


    - name: Definir DOCKER_HOST no .bashrc de cada usuário existente
      lineinfile:
        path: "/home/{{ item }}/.bashrc"
        line: 'export DOCKER_HOST=tcp://127.0.0.1:2376 DOCKER_TLS_VERIFY=1'
        create: yes
        state: present
        insertafter: EOF
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0644'
      loop: "{{ existing_docker_users }}"
      loop_control:
        label: "{{ item }}"
